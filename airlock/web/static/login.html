<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Airlock · Sign in</title>
  <link rel="icon" href="/static/favicon-32x32.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="wrap login">
    <div class="login-card panel">
      <img src="/static/apple-touch-icon.png" alt="" width="96" height="96">
      <div class="brand">AIRLOCK</div>
      <p class="tag">Dependency detonation chamber</p>
      <div class="hazard-rule"></div>
      <p>Sign in with GitHub. Access is limited to an allowlist of accounts.</p>
      <a class="gh-button" id="go" href="/auth/login">
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        Sign in with GitHub
      </a>
      <div class="err" id="err"></div>
    </div>
  </div>
  <script>
    // Fixed messages only; never reflect query text into the page.
    const MESSAGES = {
      not_allowed: 'That GitHub account is not on the allowlist. Ask the Airlock team for access.',
      state: 'Sign-in expired or was tampered with. Please try again.',
      github: 'GitHub sign-in failed. Please try again.',
      invite: 'That invite link is invalid or has expired. Ask the Airlock team for a new one.',
      invite_closed: 'That invite link has been used up or withdrawn. Ask the Airlock team for access.',
      share: 'That share link is invalid or has expired.',
    };
    const q = new URLSearchParams(location.search);
    document.getElementById('err').textContent = MESSAGES[q.get('error')] || '';
    const next = q.get('next');
    if (next && next.startsWith('/') && !next.startsWith('//')) {
      document.getElementById('go').href = '/auth/login?next=' + encodeURIComponent(next);
    }
  </script>
</body>
</html>
