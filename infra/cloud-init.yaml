#cloud-config
# Airlock host: Vultr VX1, Ubuntu 24.04.
# Rebuildable from scratch; anything done by hand on the box should land here.
# Tools are pinned to exact versions; scripts/check-pins.sh compares a live host with these pins.

hostname: airlock
timezone: UTC

users:
  - name: airlock
    groups: [sudo, kvm]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO1E7qtIMp0dD8CtJCXLeIkICUEL/06G3Sb7UhdbOXKn darkflib-ecc-2026

ssh_pwauth: false
disable_root: true

package_update: true
package_upgrade: true
packages:
  - build-essential
  - curl
  - git
  - htop
  - jq
  - nftables
  - python3-venv
  - strace
  - tmux
  - ufw
  - unzip

write_files:
  - path: /etc/ssh/sshd_config.d/10-airlock.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no

runcmd:
  - systemctl reload ssh
  - ufw default deny incoming
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - su - airlock -c 'curl -LsSf https://astral.sh/uv/0.13.7/install.sh | sh'
  - su - airlock -c '~/.local/bin/uv tool install -q mitmproxy==12.3.1'   # the egress sinkhole
  # microsandbox: the runtime is the SDK's bundled msb, pinned by uv.lock and installed by
  # scripts/install-web.sh (which also links it as the msb CLI and runs `msb doctor`). Here
  # only its storage root: msb refuses one that is group-writable, as Ubuntu's umask 002 makes it.
  - su - airlock -c 'mkdir -p ~/.microsandbox && chmod 700 ~/.microsandbox'
  # ~/.local/bin is only on PATH for login shells; link so non-interactive ssh finds them
  - ln -sf /home/airlock/.local/bin/msb /home/airlock/.local/bin/uv /usr/local/bin/
  # Caddy (official repo). Config, secrets and the app service come from scripts/deploy.sh.
  - 'curl -1sLf https://dl.cloudsmith.io/public/caddy/stable/gpg.key | gpg --batch --yes --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg'
  - 'curl -1sLf https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt -o /etc/apt/sources.list.d/caddy-stable.list'
  - apt-get update -qq
  - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq caddy=2.11.7
  - apt-mark hold caddy   # upgrade deliberately: change the pin above and in scripts/check-pins.sh
  - 'test -c /dev/kvm && echo "kvm: present" > /var/log/airlock-kvm || echo "kvm: MISSING" > /var/log/airlock-kvm'
