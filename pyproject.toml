[project]
name = "airlock"
version = "0.1.0"
description = "Detonate untrusted dependency changes in a disposable microVM and see what they actually do"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "microsandbox>=0.7",
  "openai>=1.40",
]

[project.scripts]
airlock = "airlock.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["airlock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
